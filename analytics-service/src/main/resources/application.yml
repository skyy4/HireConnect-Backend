server:
  port: 8088
spring:
  application:
    name: analytics-service
  security:
    user:
      name: admin
      password: admin
app:
  jwt:
    secret: ${JWT_SECRET:Y2hpcHN0YWNrbGFienpiYXJjb2RlaGlyZWNvbm5lY3RzZWNyZXRrZXkyMDI2}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

services:
  job-service: ${JOB_SERVICE_URL:http://localhost:8083}
  application-service: ${APPLICATION_SERVICE_URL:http://localhost:8084}
  subscription-service: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.hireconnect: DEBUG
