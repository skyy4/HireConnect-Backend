## HireConnect — Render Deployment Config
## Free tier: 750 hrs/month, Docker builds from GitHub

services:

  # ── API Gateway ─────────────────────────────────────────────────────────────
  - type: web
    name: hireconnect-gateway
    env: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        value: Y2hpcHN0YWNrbGFienpiYXJjb2RlaGlyZWNvbm5lY3RzZWNyZXRrZXkyMDI2
      - key: AUTH_SERVICE_URL
        fromService:
          name: hireconnect-auth
          type: web
          property: host
          envVarPrefix: http://
      - key: PROFILE_SERVICE_URL
        fromService:
          name: hireconnect-profile
          type: web
          property: host
          envVarPrefix: http://
      - key: JOB_SERVICE_URL
        fromService:
          name: hireconnect-job
          type: web
          property: host
          envVarPrefix: http://
      - key: APPLICATION_SERVICE_URL
        fromService:
          name: hireconnect-application
          type: web
          property: host
          envVarPrefix: http://
      - key: INTERVIEW_SERVICE_URL
        fromService:
          name: hireconnect-interview
          type: web
          property: host
          envVarPrefix: http://
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: hireconnect-notification
          type: web
          property: host
          envVarPrefix: http://
      - key: SUBSCRIPTION_SERVICE_URL
        fromService:
          name: hireconnect-subscription
          type: web
          property: host
          envVarPrefix: http://
      - key: ANALYTICS_SERVICE_URL
        fromService:
          name: hireconnect-analytics
          type: web
          property: host
          envVarPrefix: http://

  # ── Auth Service ────────────────────────────────────────────────────────────
  - type: web
    name: hireconnect-auth
    env: docker
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        value: jdbc:mysql://gateway01.ap-southeast-1.prod.alicloud.tidbcloud.com:4000/hireconnect_auth?createDatabaseIfNotExist=true&useSSL=true&requireSSL=false&verifyServerCertificate=false&allowPublicKeyRetrieval=true
      - key: DB_USERNAME
        value: 3go8pE31Kujmmxa.root
      - key: DB_PASSWORD
        value: 3lUWPCLiqkVK9Nsi
      - key: REDIS_HOST
        value: relaxed-kid-123372.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: SPRING_DATA_REDIS_PASSWORD
        value: gQAAAAAAAeHsAAIgcDFmYWUyMWZkZGM1MDA0ODBhOTUwYzk3NTJkMGU0ZDY5Mg
      - key: SPRING_DATA_REDIS_SSL_ENABLED
        value: "true"
      - key: JWT_SECRET
        value: Y2hpcHN0YWNrbGFienpiYXJjb2RlaGlyZWNvbm5lY3RzZWNyZXRrZXkyMDI2
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: GITHUB_CLIENT_ID
        sync: false   # Set manually in Render dashboard
      - key: GITHUB_CLIENT_SECRET
        sync: false   # Set manually in Render dashboard
      - key: APP_FRONTEND_URL
        sync: false   # Set to your Vercel URL after deploy
      - key: MANAGEMENT_HEALTH_MAIL_ENABLED
        value: "false"

