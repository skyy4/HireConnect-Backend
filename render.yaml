## HireConnect — Render Deployment Config
## Free tier: 750 hrs/month, Docker builds from GitHub

services:

  # ── API Gateway ─────────────────────────────────────────────────────────────
  - type: web
    name: hireconnect-gateway
    env: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        value: Y2hpcHN0YWNrbGFienpiYXJjb2RlaGlyZWNvbm5lY3RzZWNyZXRrZXkyMDI2
      - key: AUTH_SERVICE_URL
        value: https://hireconnect-auth-r6wc.onrender.com
