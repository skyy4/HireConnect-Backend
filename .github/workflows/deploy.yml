name: HireConnect Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all microservices
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: Run unit tests
        run: mvn -B test --no-transfer-progress

  deploy:
    name: Deploy → Render
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy API Gateway
        run: 'curl -s -X POST "${{ secrets.RENDER_DEPLOY_GATEWAY }}" | head -c 200'

      - name: Deploy Auth Service
        run: 'curl -s -X POST "${{ secrets.RENDER_DEPLOY_AUTH }}" | head -c 200'

      - name: Deploy Profile Service
        run: 'curl -s -X POST "${{ secrets.RENDER_DEPLOY_PROFILE }}" | head -c 200'

      - name: Deploy Job Service
        run: 'curl -s -X POST "${{ secrets.RENDER_DEPLOY_JOB }}" | head -c 200'

      - name: Deploy Application Service
        run: 'curl -s -X POST "${{ secrets.RENDER_DEPLOY_APPLICATION }}" | head -c 200'

      - name: Deploy Interview Service
        run: 'curl -s -X POST "${{ secrets.RENDER_DEPLOY_INTERVIEW }}" | head -c 200'

      - name: Deploy Notification Service
        run: 'curl -s -X POST "${{ secrets.RENDER_DEPLOY_NOTIFICATION }}" | head -c 200'

      - name: Deploy Subscription Service
        run: 'curl -s -X POST "${{ secrets.RENDER_DEPLOY_SUBSCRIPTION }}" | head -c 200'

      - name: Deploy Analytics Service
        run: 'curl -s -X POST "${{ secrets.RENDER_DEPLOY_ANALYTICS }}" | head -c 200'
