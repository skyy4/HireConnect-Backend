server:
  port: 8087
spring:
  application:
    name: subscription-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hireconnect_subscriptions?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET:Y2hpcHN0YWNrbGFienpiYXJjb2RlaGlyZWNvbm5lY3RzZWNyZXRrZXkyMDI2}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_SgyaqnHebT6pcF}
    key-secret: ${RAZORPAY_KEY_SECRET:cdH2q68rR3X5AOB0WbxG5lar}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    com.hireconnect: DEBUG
